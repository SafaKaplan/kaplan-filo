<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17100B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaplan Filo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kaplan Filo</title>
<style>
:root{
  --zemin:#F6F3EF; --kart:#FFFFFF; --cizgi:#ECE6DF; --yazi:#1E1611; --ikincil:#6B5F57;
  --vurgu:#C2540A; --vurgu-parlak:#EA7C15; --vurgu-acik:#FCE9D8;
  --koyu:#17100B; --koyu2:#2A190D;
  --yesil:#14663A; --yesil-acik:#E3F4EA; --amber:#7A4A00; --amber-acik:#FDF0D5; --kirmizi:#9B2C1F; --kirmizi-acik:#FCE4E1;
  --gri-acik:#EFEAE4; --gri-yazi:#4A3F37;
  --golge:0 1px 2px rgba(60,35,15,.06),0 8px 24px rgba(60,35,15,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--zemin);color:var(--yazi);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;font-variant-numeric:tabular-nums}
@media (display-mode:standalone){html,body{height:100vh;min-height:100vh}}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
button:active{transform:scale(.97)}
input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--vurgu-parlak);outline-offset:2px}
.hidden{display:none !important}

/* ---------- açılış ekranı ---------- */
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#110B08;transition:opacity .4s ease}
#splash.kapan{opacity:0;pointer-events:none}
#splash canvas{display:block;width:100%;height:100%}

/* ---------- uygulama iskeleti ---------- */
#uygulama{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--zemin)}
.ust{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 18px 20px;color:#fff;
  background:radial-gradient(120% 140% at 85% -20%,#3A2111 0%,rgba(23,16,11,0) 60%),linear-gradient(180deg,#1D130C,#150E09);
  border-radius:0 0 28px 28px;box-shadow:0 1px 0 rgba(234,124,21,.45),0 10px 30px rgba(23,16,11,.18)}
.ust::after{content:"";position:absolute;left:50%;bottom:-1px;width:56%;height:2px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#EA7C15,transparent);filter:blur(1px);opacity:.9}
.ust-sol{min-width:0}
.marka{font-size:11px;font-weight:700;color:#EA7C15;letter-spacing:.14em;text-transform:uppercase}
h1{margin:2px 0 0;font-size:28px;line-height:34px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ust-sag{display:flex;align-items:center;gap:6px;flex:none}
.durum-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:18px;font-size:12px;font-weight:600}
.durum-btn .nokta{width:8px;height:8px;border-radius:4px}
.durum-btn .donen{animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.ikon-btn{width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--ikincil);display:flex;align-items:center;justify-content:center}
.ust .ikon-btn{color:#CDBFB3;background:rgba(255,255,255,.07)}

.icerik{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px 176px 16px;display:flex;flex-direction:column;gap:16px}
.icerik>*{flex-shrink:0}
.icerik.gecis>*{animation:gir .34s cubic-bezier(.2,.75,.2,1) both}
.icerik.gecis>*:nth-child(2){animation-delay:.04s}.icerik.gecis>*:nth-child(3){animation-delay:.08s}
.icerik.gecis>*:nth-child(4){animation-delay:.12s}.icerik.gecis>*:nth-child(n+5){animation-delay:.16s}
@keyframes gir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#ptr{position:absolute;left:50%;top:6px;width:36px;height:36px;margin-left:-18px;border-radius:18px;background:#fff;box-shadow:var(--golge);
  display:flex;align-items:center;justify-content:center;color:var(--vurgu);opacity:0;pointer-events:none;z-index:5}
#ptr svg{transition:transform .15s}
#ptr.don svg{animation:don .8s linear infinite}

/* ---------- kartlar ---------- */
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:22px;padding:20px;box-shadow:var(--golge)}
.kart-k{background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:16px;min-width:0;box-shadow:var(--golge)}
.satir{background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(60,35,15,.05)}
.satir .orta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.satir .sag{flex:none;text-align:right;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.izgara2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.izgara3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.etiket{font-size:12px;color:var(--ikincil);font-weight:500}
.sayi{font-size:20px;font-weight:700;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sayi-b{font-size:24px;font-weight:800;line-height:32px}
.kisalt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* koyu özet kartı (hero) */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;color:#fff;display:flex;flex-direction:column;gap:16px;
  background:radial-gradient(90% 120% at 100% 0%,#4A2812 0%,rgba(30,19,12,0) 62%),linear-gradient(160deg,#24150B,#150E09);
  box-shadow:0 14px 34px rgba(23,16,11,.28),inset 0 0 0 1px rgba(234,124,21,.18)}
.hero::before{content:"";position:absolute;left:-10%;right:-10%;bottom:0;height:70px;opacity:.35;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(234,124,21,.0) 0 22px,rgba(234,124,21,.55) 22px 23px);
  -webkit-mask-image:linear-gradient(0deg,#000,transparent);mask-image:linear-gradient(0deg,#000,transparent);transform:perspective(160px) rotateX(55deg);transform-origin:bottom}
.hero>*{position:relative}
.hero .e{font-size:12px;color:#CDBFB3;font-weight:500}
.hero .buyuk{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.02em}
.hero .ust-satir{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .ince{height:1px;background:rgba(255,255,255,.12)}
.hero-izgara{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hero-izgara b{display:block;font-size:17px;font-weight:700}
.yigin{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:rgba(255,255,255,.08)}
.yigin i{display:block;height:100%;min-width:4px}
.lejant{display:flex;flex-direction:column;gap:8px}
.lejant div{display:flex;align-items:center;gap:8px;font-size:13px;color:#E6DCD2}
.lejant u{width:10px;height:10px;border-radius:3px;flex:none}
.lejant span{margin-left:auto;font-weight:700;color:#fff}
.ilerleme{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.ilerleme div{height:100%;border-radius:4px;background:linear-gradient(90deg,#EA7C15,#F6B05A)}

/* ay çubuğu */
.ay-cubuk{display:flex;align-items:center;justify-content:space-between;background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:4px;box-shadow:var(--golge)}
.ay-cubuk button{width:48px;height:48px;border:0;border-radius:16px;background:var(--gri-acik);color:var(--yazi);display:flex;align-items:center;justify-content:center}
.ay-cubuk .ad{font-size:17px;font-weight:700;text-align:center;line-height:20px}
.ay-cubuk .ad small{display:block;font-size:12px;font-weight:500;color:var(--ikincil)}
.yatay{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.yatay::-webkit-scrollbar{display:none}
.cip{flex:none;height:44px;padding:0 18px;border-radius:22px;font-size:14px;font-weight:700;white-space:nowrap;border:1px solid var(--cizgi);background:#fff;color:var(--yazi);letter-spacing:.02em}
.cip.acik{border-color:var(--koyu);background:var(--koyu);color:#F6B05A}

/* takvim */
.takvim{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.gun-adi{text-align:center;font-size:11px;color:var(--ikincil);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.gun-adi.hs{color:var(--vurgu)}
.gun{position:relative;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border:1px solid var(--cizgi);background:#fff;color:var(--yazi)}
.gun.hs{background:#FBF8F4}
.gun b{font-size:15px;line-height:18px}
.gun i{font-style:normal;font-size:11px;line-height:12px;font-weight:700}
.gun.c{background:#CFEBD9;border-color:#BCE1CB;color:#0F4F2C}
.gun.t{background:#F9E2B0;border-color:#F1D48F;color:#5C3700}
.gun.s{background:#DDD6CF;border-color:#D0C8C0;color:#3A322B}
.gun.bugun::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:3px;background:var(--vurgu)}
.gun.bugun b{color:var(--vurgu)}
.gun.sec{border-color:var(--vurgu-parlak);box-shadow:0 0 0 3px rgba(234,124,21,.35);transform:scale(.96)}
.gun.sec::before{content:"✓";position:absolute;top:-6px;right:-4px;width:18px;height:18px;border-radius:9px;background:var(--vurgu);color:#fff;font-size:11px;line-height:18px;font-weight:800;text-align:center}
.gun.bos{visibility:hidden}
.not{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ikincil)}
.not span{display:inline-flex;align-items:center;gap:8px}
.not u{width:12px;height:12px;border-radius:4px;display:inline-block}
.ipucu{font-size:14px;color:var(--ikincil);text-align:center;padding:0 16px;line-height:20px}
.halka-k{display:flex;align-items:center;gap:18px}
.halka{position:relative;width:84px;height:84px;flex:none}
.halka svg{display:block}
.halka .ic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.halka .ic b{font-size:22px;font-weight:800;color:#fff}
.halka .ic span{font-size:11px;color:#CDBFB3}
.mini-istat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex:1}
.mini-istat>div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px}
.mini-istat b{display:block;font-size:20px;font-weight:800;line-height:24px}

/* listeler */
.grup-b{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:4px 4px 0;font-size:13px;font-weight:700;color:var(--ikincil)}
.grup-b span:last-child{color:var(--yazi)}
.liste{display:flex;flex-direction:column;gap:8px}
.simge{flex:none;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.hap{display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:12px;font-size:12px;font-weight:600;background:var(--gri-acik);color:var(--gri-yazi);max-width:100%}
.hap.amber{background:var(--amber-acik);color:var(--amber)}
.hap.yesil{background:var(--yesil-acik);color:var(--yesil)}
.hap.kirmizi{background:var(--kirmizi-acik);color:var(--kirmizi)}
.hap-grup{display:flex;gap:6px;flex-wrap:wrap}
.baslik-s{font-size:15px;font-weight:700}
.alt-s{font-size:13px;color:var(--ikincil)}
.tutar{font-size:16px;font-weight:800;white-space:nowrap}
.bos-durum{background:#fff;border:1.5px dashed #DDD3C8;border-radius:22px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.bos-durum .daire{width:60px;height:60px;border-radius:30px;background:var(--vurgu-acik);color:var(--vurgu);display:flex;align-items:center;justify-content:center}
.bos-durum .b{font-size:16px;font-weight:700}
.bos-durum .a{font-size:14px;color:var(--ikincil);line-height:20px}
.iskelet{display:flex;flex-direction:column;gap:16px}
.iskelet div{border-radius:22px;background:linear-gradient(90deg,#EAE3DB 0%,#F4EFE9 50%,#EAE3DB 100%);background-size:200% 100%;animation:parilti 1.3s infinite linear}
@keyframes parilti{to{background-position:-200% 0}}
.cubuk{height:8px;border-radius:4px;background:#F0EAE3;overflow:hidden}
.cubuk div{height:8px;border-radius:4px}
.grafik{width:100%;height:auto;display:block}
.grafik text{font-family:inherit;font-size:10px;fill:#8A7D73;font-weight:600}

.logo-plaka{display:inline-flex;align-items:center;background:#fff;border-radius:10px;padding:4px 8px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.logo-plaka img{display:block;height:34px;width:auto}
.alt-sekme{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:14px 16px 0;padding:4px;background:#EFE8E0;border-radius:16px}
.alt-sekme button{height:44px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;color:#6B5F57}
.alt-sekme button.acik{background:#fff;color:var(--vurgu);box-shadow:0 1px 4px rgba(60,35,15,.15)}
.gun i.say{font-style:normal;font-size:10px;font-weight:800;opacity:.85}
.pl-satir{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 4px;border-bottom:1px solid var(--cizgi);cursor:pointer}
.panel .pl-satir input[type=checkbox]{width:26px;min-width:26px;height:26px;min-height:26px;padding:0;margin:0;flex:none;accent-color:#C2540A;border:0;box-shadow:none;background:none}
.pl-satir .o{flex:1;min-width:0}.pl-satir .o b{display:block;font-size:15px}.pl-satir .o span{display:block;font-size:12px;color:#6B5F57}
.pl-satir .hap{flex:none}
.hizli{display:flex;gap:8px;flex-wrap:wrap}
.hizli button{height:36px;padding:0 14px;border:1px solid var(--cizgi);border-radius:18px;background:#fff;font-size:13px;font-weight:700;color:#4A3F37}
.firma-k{padding:0;overflow:hidden}
.firma-b{width:100%;display:flex;align-items:center;gap:12px;padding:16px;border:0;background:transparent;text-align:left}
.firma-b .o{flex:1;min-width:0}.firma-b .o b{display:block;font-size:16px}.firma-b .o span{font-size:12px;color:#6B5F57}
.firma-b .t{font-size:16px;font-weight:800;white-space:nowrap}
.arac-s{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--cizgi);font-size:14px}
.arac-s .o{min-width:0}.arac-s .o b{display:block}.arac-s .o span{font-size:12px;color:#6B5F57}
.arac-s .t{font-weight:800;white-space:nowrap;text-align:right}
.kz-izgara{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kz-kart{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--golge);min-width:0}
.kz-kart.genis{grid-column:1 / -1}
.kz-kart .b{font-size:11px;font-weight:700;color:#6B5F57;letter-spacing:.02em}
.kz-kart .d{font-size:18px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}

/* alt aksiyonlar */
.aksiyon{position:absolute;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;background:var(--koyu);border-radius:22px;padding:8px 8px 8px 20px;box-shadow:0 12px 32px rgba(23,16,11,.35),inset 0 0 0 1px rgba(234,124,21,.25);animation:gir .25s ease both}
.aksiyon .m{flex:1;min-width:0;color:#fff;font-size:14px;font-weight:700}
.aksiyon button{height:48px;border:0;border-radius:15px;font-size:15px;font-weight:700}
.fab{position:absolute;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));height:58px;padding:0 24px 0 20px;border:0;border-radius:29px;display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,#EA7C15,#C2540A);color:#fff;font-size:16px;font-weight:800;box-shadow:0 12px 28px rgba(194,84,10,.45);animation:gir .25s ease both}

nav{flex:none;position:relative;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--cizgi);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(8px + env(safe-area-inset-bottom)) 8px}
nav button{border:0;background:transparent;border-radius:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:#7C6F65;letter-spacing:.01em}
nav button .ik{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background-color .2s,color .2s,transform .2s}
nav button.aktif{color:var(--vurgu)}
nav button.aktif .ik{background:var(--vurgu-acik);color:var(--vurgu);transform:translateY(-1px)}

/* alttan açılan paneller */
.perde{position:fixed;inset:0;background:rgba(23,16,11,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:solma .2s ease both}
@keyframes solma{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-width:560px;max-height:92%;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(20,24,30,.25);animation:yuk .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes yuk{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.tutamac{display:flex;justify-content:center;padding-top:10px}
.tutamac div{width:44px;height:5px;border-radius:3px;background:#DDD3C8}
.panel-ust{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 20px}
.panel-ust h2{margin:0;font-size:20px;font-weight:800}
.panel-govde{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px 20px;display:flex;flex-direction:column;gap:16px}
.panel-alt{padding:16px 20px calc(24px + env(safe-area-inset-bottom)) 20px;border-top:1px solid var(--cizgi)}
.alan{display:flex;flex-direction:column;gap:8px;min-width:0}
.alan label,.alan .l{font-size:12px;font-weight:700;color:var(--ikincil);letter-spacing:.02em}
.alan input,.alan select{height:50px;border:1.5px solid #E0D7CD;border-radius:14px;padding:0 14px;font-size:16px;background:#fff;color:var(--yazi);width:100%;min-width:0}
.alan input:focus,.alan select:focus{border-color:var(--vurgu-parlak);outline:none;box-shadow:0 0 0 4px rgba(234,124,21,.18)}
.alan input.hata,.alan select.hata{border:2px solid #B3261E}
.hata-m{font-size:13px;color:var(--kirmizi);font-weight:500}
.seg{display:grid;gap:4px;background:#EFEAE4;border-radius:16px;padding:4px}
.seg button{height:48px;border:0;border-radius:12px;font-size:14px;font-weight:700;background:transparent;color:#5A4E45;padding:0 4px}
.seg button.acik{background:#fff;color:var(--yazi);box-shadow:0 1px 3px rgba(27,31,36,.18)}
.ozet{background:var(--zemin);border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.ozet div{display:flex;justify-content:space-between;font-size:14px;color:var(--ikincil)}
.ozet b{color:var(--yazi)}
.ozet .top{font-size:16px;font-weight:800;color:var(--yazi)}
.ozet hr{border:0;height:1px;background:var(--cizgi);margin:0}
.ana-btn{height:56px;width:100%;border:0;border-radius:18px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#EA7C15,#C2540A);box-shadow:0 8px 20px rgba(194,84,10,.3)}
.ana-btn[disabled]{background:#B98A6C;box-shadow:none}
.ikinci-btn{height:48px;width:100%;border:0;border-radius:14px;font-size:15px;font-weight:700;background:#EFEAE4;color:#4A3F37}
.toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);max-width:528px;margin:0 auto;z-index:150;padding:14px 16px 14px 20px;border-radius:16px;overflow:hidden;font-size:14px;font-weight:700;line-height:20px;
  background:#fff;color:var(--yazi);box-shadow:0 10px 30px rgba(0,0,0,.35);animation:gir .25s ease both}
.toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:#EA7C15}
.toast.h::before{background:#C0392B}
.toast.u::before{background:#F2C14E}
/* giriş ekranı: açılış ekranıyla aynı karanlık tema */
.giris{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;
  background:radial-gradient(80% 50% at 50% 100%,rgba(234,124,21,.28),rgba(17,11,8,0) 70%),#110B08}
.giris-k{width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px;color:#EEE6DE}
.plaka-k{align-self:center;display:flex;align-items:center;justify-content:center;width:min(86%,330px);aspect-ratio:3.3/1;background:#fff;
  clip-path:polygon(7% 0,100% 0,100% 72%,93% 100%,0 100%,0 28%);padding:14px 22px}
.plaka-k img{width:100%;height:100%;object-fit:contain}
.giris-k .marka{text-align:center;margin-top:4px}
.giris-k h1{font-size:26px;white-space:normal;text-align:center;color:#fff;margin:0}
.giris-k .alan label{color:#B9AA9D}
.giris-k .alan input{background:#1F150E;border-color:#4A2D18;color:#fff}
.giris-k .alan input:focus{border-color:#EA7C15}
.giris-k .hata-m{color:#F4A29A}
.not-k{font-size:13px;line-height:20px;color:#9C8E82;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><canvas id="splash-canvas"></canvas></div>

<div id="giris" class="giris hidden">
  <form id="giris-form" class="giris-k" autocomplete="on">
    <div class="plaka-k"><img src="logo.png" alt="Kaplan Beton Elemanları"></div>
    <div>
      <div class="marka">Filo ve operasyon yönetimi</div>
      <h1>Giriş yap</h1>
    </div>
    <div class="alan">
      <label for="g-eposta">E-posta</label>
      <input id="g-eposta" type="email" autocomplete="username" inputmode="email" required>
    </div>
    <div class="alan">
      <label for="g-sifre">Şifre</label>
      <input id="g-sifre" type="password" autocomplete="current-password" required>
      <div id="g-hata" class="hata-m hidden" role="alert"></div>
    </div>
    <button id="g-btn" class="ana-btn" type="submit">Giriş yap</button>
    <div class="not-k">Bu uygulama sadece yetkili kullanıcı içindir.</div>
  </form>
</div>

<div id="uygulama" class="hidden">
  <header class="ust">
    <div class="ust-sol"><span class="logo-plaka"><img src="logo.png" alt="Kaplan Filo" height="34"></span></div>
    <div class="ust-sag">
      <button id="durum" class="durum-btn" type="button" aria-label="Verileri yenile"></button>
      <button id="cikis" class="ikon-btn" type="button" aria-label="Çıkış yap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>
  <div id="alt-sekme" class="alt-sekme hidden" role="tablist">
    <button type="button" role="tab" data-alt="puantaj">Puantaj</button>
    <button type="button" role="tab" data-alt="hakedis">Hakediş</button>
  </div>
  <main id="icerik" class="icerik"></main>
  <div id="ptr" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></div>
  <div id="aksiyon-alani"></div>
  <nav aria-label="Ana gezinme">
    <button type="button" data-sekme="puantaj">
      <span class="ik"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>
      <span>Puantaj</span></button>
    <button type="button" data-sekme="gider">
      <span class="ik"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7l10 10M17 9v8H9"/></svg></span>
      <span>Gider</span></button>
    <button type="button" data-sekme="gelir">
      <span class="ik"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 17L7 7M7 15V7h8"/></svg></span>
      <span>Gelir</span></button>
    <button type="button" data-sekme="karzarar">
      <span class="ik"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>
      <span>Kâr/Zarar</span></button>
  </nav>
</div>

<div id="panel-alani"></div>
<div id="toast-alani"></div>

<script src="splash.js"></script>
<script src="app.js"></script>
</body>
</html>
